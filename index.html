<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluent</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f5f4fb; --card:#ffffff; --ink:#1d1b2e; --muted:#6b6880; --line:#e4e2ef;
  --brand:#4f46e5; --brand2:#0ea5a4; --soft:#eef0ff; --good:#16a34a; --bad:#dc2626; --warn:#d97706;
  --goodbg:#e8f7ee; --badbg:#fdecec;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121220; --card:#1c1c2e; --ink:#ecebf5; --muted:#a3a1b8; --line:#2d2c44;
    --brand:#8b84ff; --brand2:#2dd4bf; --soft:#25244a; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --goodbg:#163126; --badbg:#3a1d1f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--brand)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#4f46e5,#7c3aed 55%,#0ea5a4);color:#fff;padding:12px 16px calc(12px) 16px}
header .row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:13px;opacity:.9}
header .back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:15px}
main{max-width:760px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;text-align:center;padding:9px 0 8px;font-size:12px;color:var(--muted);text-decoration:none}
nav a b{display:block;font-size:20px;line-height:1.1;font-weight:400}
nav a.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 6px}
.card h3{font-size:15px;margin:10px 0 4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin:0 4px 4px 0}
.tag.t2{background:#e0f7f5;color:#0f766e}
@media (prefers-color-scheme: dark){.tag.t2{background:#123a37;color:#5eead4}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;font-size:15px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0;text-decoration:none;min-height:42px}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.g{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{padding:6px 10px;font-size:14px;min-height:36px}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,var(--soft),var(--card));}
.ring{display:flex;align-items:center;gap:14px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.block{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.block .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.block .bd{flex:1;min-width:0}
.block .nm{font-weight:650}
.block .ok{font-size:22px;color:var(--good)}
.block.done .ic{background:var(--goodbg)}
.word{font-size:24px;font-weight:750;margin:2px 0}
.ipa{color:var(--muted);font-size:15px}
.ex{background:var(--soft);border-radius:12px;padding:8px 10px;margin:8px 0}
.img{width:100%;aspect-ratio:16/10;background:var(--line);border-radius:12px;overflow:hidden;position:relative;margin-bottom:8px}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img .cap{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:8px;padding:2px 6px}
.img .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.yg{margin:8px 0;border-radius:12px;overflow:hidden;position:relative}
.cover{position:absolute;left:0;right:0;bottom:0;height:38%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;border-top:1px dashed var(--line)}
.tr{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;min-height:40px}
.hit{color:var(--good);font-weight:650}
.miss{color:var(--bad);text-decoration:underline dotted}
.score{font-weight:700}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0}
textarea{min-height:70px}
.list a.w{display:flex;justify-content:space-between;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.list a.w:last-child{border-bottom:0}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0;font-size:14px;background:var(--card)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.days a{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:13px;color:var(--ink);text-decoration:none}
.days a.cur{border-color:var(--brand);font-weight:700}
.days a.dn{background:var(--goodbg)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.bars div{flex:1;background:linear-gradient(0deg,var(--brand),var(--brand2));border-radius:4px 4px 0 0;min-height:2px}
.blabels{display:flex;gap:4px;font-size:10px;color:var(--muted)}
.blabels span{flex:1;text-align:center}
.line{border-top:1px solid var(--line);margin:12px 0}
.say{border-left:4px solid var(--brand);padding:6px 10px;background:var(--soft);border-radius:0 12px 12px 0;margin:8px 0}
.hint{border-left:4px solid var(--warn);padding:6px 10px;margin:8px 0}
.model{border-left:4px solid var(--good);padding:6px 10px;margin:8px 0;background:var(--goodbg);border-radius:0 12px 12px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
details summary{cursor:pointer;font-weight:600}
.flash{font-size:20px;font-weight:700;text-align:center;padding:10px}
.center{text-align:center}
</style>
</head>
<body>
<header><div class="row"><button class="back" id="back" hidden>&#8592;</button><div><h1 id="ttl">Fluent</h1><div class="sub" id="sub"></div></div><div style="flex:1"></div><div class="timer" id="clock"></div></div></header>
<main id="main"></main>
<nav>
  <a href="#today" data-t="today"><b>&#9728;</b>Today</a>
  <a href="#words" data-t="words"><b>&#9733;</b>Words</a>
  <a href="#plan" data-t="plan"><b>&#9776;</b>Plan</a>
  <a href="#progress" data-t="progress"><b>&#9650;</b>Progress</a>
</nav>
<div class="toast" id="toast"></div>
<script src="course.js"></script>
<script src="app.js"></script>
</body>
</html>
